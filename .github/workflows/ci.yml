name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quick:
    name: quick (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      - name: typecheck
        run: npm run typecheck

      - name: test (builds first)
        run: npm test

  heavy:
    name: heavy tests (a real Stryker, Jest and Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: heavy tests
        run: npm run test:heavy

  gates:
    name: test gates (checks, 100% coverage, negative control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build

      - name: test gates (static checks + per-file 100% coverage)
        run: npm run test:gates

      - name: negative control
        run: npm run test:gates:selfcheck

  mutation:
    name: mutation test (full run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build

      - name: mutation test (full run)
        run: npm run test:gates:mutation -- --force

  node20:
    # engines.node is >=20. Stryker 10 does not start below Node 22.12, so the mutation test
    # runs only in the job above.
    name: build and test (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: test (builds first; includes the CLI integration tests)
        run: npm test

      - name: heavy tests (those with Stryker skip themselves)
        run: npm run test:heavy
